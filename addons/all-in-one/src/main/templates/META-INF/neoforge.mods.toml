modLoader="lowcodefml"
loaderVersion="${loader_version_range}"
license="GPL-3.0-only"

[[mods]]
modId="${aio_mod_id}"
version="${aio_version}"
displayName="RotP All-in-One (open source)"
authors="Campione01 (container); the core's authors are listed in its META-INF/NOTICE-ROTP.md, those of each add-on in META-INF/NOTICE.md"
description='''The ROTP 1.21.1 core and the 82 open-source RotP 1.21.1 add-ons in one jar. Each nested jar is its own mod, with its own mod id, version, license, configs and screens; NeoForge loads them through Jar-in-Jar. This container has no code of its own and is GPL-3.0-only; each nested mod keeps its own license (the core: META-INF/LICENSE-ROTP.txt, NOTICE-ROTP.md and THIRD_PARTY_NOTICES.md in its jar; each add-on: META-INF/LICENSE and META-INF/SOURCE_AND_LICENSE.md in its jar). Curios API, GeckoLib, Pehkui and Caelus API are not included and must be installed as separate mods.'''

[[dependencies.${aio_mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${aio_mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${aio_mod_id}]]
modId="${core_mod_id}"
type="required"
versionRange="[${core_mod_version}]"
ordering="NONE"
side="BOTH"

[[dependencies.${aio_mod_id}]]
modId="curios"
type="required"
versionRange="[9.5.1+1.21.1]"
ordering="NONE"
side="BOTH"

[[dependencies.${aio_mod_id}]]
modId="geckolib"
type="required"
versionRange="[4.9.2,4.10)"
ordering="NONE"
side="BOTH"

[[dependencies.${aio_mod_id}]]
modId="pehkui"
type="required"
versionRange="[3.8.3,3.9)"
ordering="NONE"
side="BOTH"

[[dependencies.${aio_mod_id}]]
modId="caelus"
type="required"
versionRange="[7.0.1,)"
ordering="NONE"
side="BOTH"
