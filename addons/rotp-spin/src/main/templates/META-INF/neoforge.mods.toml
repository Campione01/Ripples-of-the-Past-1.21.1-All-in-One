modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GPL-3.0-only"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Loischsiy"
credits="StandoByte"
description='''${mod_description}'''

[[mixins]]
config="rotp_spin.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${core_mod_id}"
type="required"
versionRange="[${core_mod_version},0.3)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="[9.5.1,10)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="rotp_t"
type="optional"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="rotp_d4c"
type="optional"
ordering="AFTER"
side="BOTH"
