modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GPL-3.0-only"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
credits="Port work for Ripples of the Past"
description='''${mod_description}'''
displayTest="IGNORE_ALL_VERSION"

[[mixins]]
config="rotp_kingcrimson_voxy.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},21.2)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${core_mod_id}"
type="required"
versionRange="[${core_mod_version},0.3)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="rotp_kingcrimson"
type="optional"
ordering="AFTER"
side="CLIENT"

# No version range on purpose: what this add-on needs from Voxy is checked by its own anchors, at load.
[[dependencies.${mod_id}]]
modId="voxy"
type="optional"
ordering="AFTER"
side="CLIENT"
