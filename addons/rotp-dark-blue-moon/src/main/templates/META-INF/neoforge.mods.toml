modLoader="javafml"
loaderVersion="${loader_version_range}"
license="GPL-3.0-only"
issueTrackerURL="https://ifdian.net/a/mazaNB666"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
logoFile="darkbluemoon.png"
logoBlur=true
authors="Grasshopper, Day_GeE"
credits="Grasshopper (Author), Day_GeE (Modeler) | Support: https://ifdian.net/a/mazaNB666"
description='''${mod_description}

Dark Blue Moon - A JoJo Stand addon by Grasshopper.
The original GPL-3.0 models, animations, textures, sounds and language files are retained from RotP-DarkBlueMoon-1.0.jar.
The source and the migration boundary are packaged in SOURCE_AND_LICENSE.md.'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="${core_mod_id}"
type="required"
versionRange="[${core_mod_version}]"
ordering="AFTER"
side="BOTH"
